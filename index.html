
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя 🩷</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow:hidden;font-family:Montserrat,sans-serif;color:white;background:radial-gradient(circle at 50% 40%,rgba(255,40,150,.15),transparent 35%),radial-gradient(circle at 20% 80%,rgba(130,30,180,.12),transparent 35%),linear-gradient(180deg,#05020a,#100412 50%,#030207)}
.pink-glow,.purple-glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none}
.pink-glow{width:350px;height:350px;background:#ff2b9a;opacity:.18;left:-150px;top:25%}
.purple-glow{width:300px;height:300px;background:#9d3cff;opacity:.15;right:-130px;top:35%}
.city{position:fixed;bottom:0;left:0;width:100%;height:27vh;display:flex;align-items:flex-end;justify-content:center;gap:4px;z-index:0;opacity:.9}
.building{position:relative;width:8vw;min-width:35px;background:linear-gradient(#15101b,#050308);border-top:1px solid rgba(255,75,170,.08)}
.building:nth-child(1){height:45%}.building:nth-child(2){height:70%}.building:nth-child(3){height:55%}.building:nth-child(4){height:85%}.building:nth-child(5){height:63%}.building:nth-child(6){height:92%}.building:nth-child(7){height:58%}.building:nth-child(8){height:78%}.building:nth-child(9){height:50%}.building:nth-child(10){height:72%}.building:nth-child(11){height:60%}
.window{position:absolute;width:4px;height:8px;background:#ff8bc9;box-shadow:0 0 8px rgba(255,80,180,.7);opacity:.5}
.web{position:fixed;width:310px;height:310px;z-index:2;opacity:.42;pointer-events:none}
.web-left{top:-55px;left:-55px}.web-right{top:-55px;right:-55px;transform:scaleX(-1)}
.web svg{width:100%;height:100%}
.spiderman{position:fixed;right:7%;top:-10px;width:110px;height:250px;z-index:3;animation:swing 4s ease-in-out infinite;transform-origin:top center}
.web-line{position:absolute;top:0;left:50%;width:2px;height:90px;background:linear-gradient(transparent,rgba(255,180,225,.7))}
.hero{position:absolute;top:85px;left:22px;width:65px;height:125px}
.head{position:absolute;width:40px;height:44px;left:12px;top:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5eb5,#b50062 70%);box-shadow:0 0 20px rgba(255,30,150,.45)}
.eye{position:absolute;width:11px;height:18px;top:12px;background:white;border:2px solid #270018;transform:rotate(-18deg)}
.eye.left{left:6px}.eye.right{right:6px;transform:rotate(18deg)}
.suit-body{position:absolute;width:47px;height:62px;left:9px;top:39px;border-radius:45% 45% 20% 20%;background:linear-gradient(140deg,#d71975 0%,#9d145b 45%,#26104c 46%,#09051b 100%);box-shadow:0 0 15px rgba(255,30,150,.25)}
.arm{position:absolute;width:12px;height:58px;top:45px;background:#190b38;border-radius:10px}
.arm.left{left:2px;transform:rotate(25deg)}.arm.right{right:2px;transform:rotate(-25deg)}
.leg{position:absolute;width:14px;height:52px;top:95px;background:#11072c;border-radius:10px}
.leg.left{left:14px;transform:rotate(15deg)}.leg.right{right:14px;transform:rotate(-15deg)}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.screen{position:relative;z-index:5;min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;padding:25px}
.content{width:100%;max-width:700px}
.spider-symbol{font-size:45px;margin-bottom:15px;filter:drop-shadow(0 0 15px #ff2b9a);animation:heartbeat 2s infinite}
.intro-title{font-family:"Cormorant Garamond",serif;font-size:clamp(58px,10vw,92px);font-weight:600;letter-spacing:2px;color:#fff;text-shadow:0 0 8px #ff4eaa,0 0 25px rgba(255,30,150,.7),0 0 55px rgba(170,30,255,.35);margin-bottom:10px}
.subtitle{font-family:"Cormorant Garamond",serif;font-size:23px;color:rgba(255,220,240,.82);font-style:italic;margin:0 auto 32px;max-width:620px;line-height:1.45}
.open-btn{border:1px solid rgba(255,100,190,.8);background:linear-gradient(135deg,rgba(255,40,150,.25),rgba(150,30,180,.2));color:white;padding:16px 35px;border-radius:50px;font-family:Montserrat,sans-serif;font-size:15px;cursor:pointer;box-shadow:0 0 15px rgba(255,30,150,.45),inset 0 0 15px rgba(255,80,180,.1);transition:all .35s}
.open-btn:hover{transform:translateY(-3px) scale(1.04);border-color:#ff65ba;box-shadow:0 0 25px rgba(255,30,150,.8)}
.story{display:none}.story.active{display:block}
.message{min-height:210px;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:clamp(30px,6vw,52px);line-height:1.3;color:#fff1fa;text-shadow:0 0 10px rgba(255,90,180,.5);opacity:0;transform:translateY(25px) scale(.97);transition:opacity 1s,transform 1s}
.message.show{opacity:1;transform:translateY(0) scale(1)}
.message.final{font-size:clamp(43px,8vw,72px);font-weight:700;text-shadow:0 0 10px #ff54ad,0 0 30px #ff1990}
.next{margin-top:25px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,200,230,.65);animation:pulse 2s infinite}
.heart{position:fixed;bottom:-30px;z-index:30;pointer-events:none;animation:floatUp linear forwards}
@keyframes floatUp{from{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.9}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
.gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(5,2,10,.48);backdrop-filter:blur(3px);transition:opacity .9s,visibility .9s}
.gate.unlocked{opacity:0;visibility:hidden;pointer-events:none}
.gate-card{width:min(100%,490px);padding:clamp(26px,5vw,42px) 25px;border:1px solid rgba(255,120,195,.38);border-radius:28px;background:linear-gradient(145deg,rgba(29,8,31,.94),rgba(9,5,20,.94));box-shadow:0 0 35px rgba(255,30,150,.2);text-align:center;animation:cardIn .8s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.gate-icon{font-size:38px;margin-bottom:13px;filter:drop-shadow(0 0 12px #ff2b9a)}
.gate-title{font-family:"Cormorant Garamond",serif;font-size:clamp(31px,7vw,43px);line-height:1.08;margin-bottom:12px;text-shadow:0 0 18px rgba(255,50,160,.45)}
.gate-welcome{font-size:13px;line-height:1.7;color:#ffd6ed;margin:0 auto 18px}
.hint{font-size:12px;line-height:1.6;color:rgba(255,220,240,.75);margin-bottom:17px}
.password-form{display:flex;flex-direction:column;gap:12px}
.password-input{width:100%;padding:15px 18px;border-radius:15px;border:1px solid rgba(255,130,200,.48);background:rgba(5,2,12,.75);color:white;text-align:center;font:500 18px Montserrat,sans-serif;letter-spacing:5px;outline:none}
.password-input:focus{border-color:#ff70bd;box-shadow:0 0 0 3px rgba(255,60,160,.12)}
.password-input::placeholder{letter-spacing:1px;color:rgba(255,220,240,.4);font-size:13px}
.error{min-height:38px;font-size:12px;line-height:1.5;color:#ffabd5;padding-top:2px}
.gate-card.shake{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(max-width:600px){.spiderman{right:-15px;transform:scale(.7)}.web{width:200px;height:200px}.intro-title{font-size:60px}.subtitle{font-size:19px}.message{min-height:240px}.gate{padding:15px}.gate-card{padding:28px 20px}.gate-welcome{font-size:12px}}
</style>
</head>
<body>
<div class="pink-glow"></div><div class="purple-glow"></div>

<div class="web web-left"><svg viewBox="0 0 310 310" aria-hidden="true"><g fill="none" stroke="rgba(255,160,220,.55)" stroke-width="1"><path d="M0 0 Q90 35 310 0"/><path d="M0 0 Q40 90 0 310"/><path d="M0 0 Q130 70 310 45"/><path d="M0 0 Q70 130 30 310"/><path d="M0 0 Q160 110 310 100"/><path d="M0 0 Q100 170 75 310"/><path d="M0 0 Q210 170 170 310"/><path d="M0 0 Q270 120 310 200"/></g></svg></div>
<div class="web web-right"><svg viewBox="0 0 310 310" aria-hidden="true"><g fill="none" stroke="rgba(255,160,220,.55)" stroke-width="1"><path d="M0 0 Q90 35 310 0"/><path d="M0 0 Q40 90 0 310"/><path d="M0 0 Q130 70 310 45"/><path d="M0 0 Q70 130 30 310"/><path d="M0 0 Q160 110 310 100"/><path d="M0 0 Q100 170 75 310"/><path d="M0 0 Q210 170 170 310"/><path d="M0 0 Q270 120 310 200"/></g></svg></div>
<div class="spiderman" aria-hidden="true"><div class="web-line"></div><div class="hero"><div class="head"><div class="eye left"></div><div class="eye right"></div></div><div class="suit-body"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div></div></div>
<div class="city" aria-hidden="true"><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div></div>

<section class="gate" id="gate">
  <div class="gate-card" id="gateCard">
    <div class="gate-icon">🕷️💗</div>
    <h1 class="gate-title">Секретный вход</h1>
    <p class="gate-welcome">Внимание! Обнаружен самый дорогой посетитель этого сайта.<br>Запускаем режим повышенной милоты.<br><strong>Привет, Алия!</strong></p>
    <p class="hint">Этот сайт защищён маленькой тайной.<br>Подсказка: связано с одним фильмом, который нам нравится (цифры).</p>
    <form class="password-form" id="passwordForm">
      <input class="password-input" id="passwordInput" type="password" inputmode="numeric" autocomplete="off" placeholder="Введи пароль" aria-label="Секретный пароль" required>
      <button class="open-btn" type="submit">Открыть секрет ❤️</button>
      <p class="error" id="errorMessage" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<main class="screen" id="mainScreen" aria-hidden="true">
  <div class="content">
    <div id="intro">
      <div class="spider-symbol">🕷️</div>
      <div class="intro-title">Для тебя</div>
      <div class="subtitle">кое-что, что я хочу тебе сказать...</div>
      <button class="open-btn" id="openStory">Открыть ❤️</button>
    </div>
    <div id="story" class="story">
      <div id="message" class="message"></div>
      <div id="next" class="next">Нажми на экран</div>
    </div>
  </div>
</main>

<script>
const SECRET_PASSWORD = "143";
const messages = [
  "Я хочу всегда видеть твою улыбку.",
  "Даже в самые обычные дни.",
  "Потому что когда улыбаешься ты — счастливее становлюсь и я.",
  "Алия, я люблю тебя. ❤️"
];

const gate = document.getElementById("gate");
const gateCard = document.getElementById("gateCard");
const passwordForm = document.getElementById("passwordForm");
const passwordInput = document.getElementById("passwordInput");
const errorMessage = document.getElementById("errorMessage");
const intro = document.getElementById("intro");
const story = document.getElementById("story");
const message = document.getElementById("message");
const next = document.getElementById("next");
let current = 0;
let unlocked = false;

passwordForm.addEventListener("submit", function(event) {
  event.preventDefault();
  if (passwordInput.value.trim() === SECRET_PASSWORD) {
    unlocked = true;
    errorMessage.textContent = "";
    gate.classList.add("unlocked");
    burstHearts();
    setTimeout(() => { gate.style.display = "none"; }, 950);
  } else {
    const jokes = [
      "Хмм, почти! Попробуй ещё раз, ты точно знаешь эти цифры 😉",
      "Эй, а ты точно та самая девушка? Вспоминай, Алия 😏",
      "Доступ запрещён… слишком милая попытка. Попробуй ещё раз 💗"
    ];
    errorMessage.textContent = jokes[Math.floor(Math.random() * jokes.length)];
    gateCard.classList.remove("shake");
    void gateCard.offsetWidth;
    gateCard.classList.add("shake");
    passwordInput.select();
  }
});

function burstHearts() {
  const symbols = ["🩷","❤️","💗","💕","✨","🕷️"];
  for (let i = 0; i < 34; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    heart.style.left = (5 + Math.random() * 90) + "vw";
    heart.style.bottom = (10 + Math.random() * 35) + "vh";
    heart.style.fontSize = (15 + Math.random() * 22) + "px";
    heart.style.animationDuration = (2.2 + Math.random() * 2.4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  const symbols = ["🩷","❤️","💗","✨","🕷️"];
  heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (12 + Math.random() * 18) + "px";
  heart.style.animationDuration = (5 + Math.random() * 5) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 10000);
}
setInterval(createHeart, 800);

function startStory() {
  intro.style.display = "none";
  story.classList.add("active");
  setTimeout(showMessage, 500);
}
function showMessage() {
  if (current >= messages.length) return;
  message.classList.remove("show");
  setTimeout(() => {
    message.textContent = messages[current];
    if (current === messages.length - 1) {
      message.classList.add("final");
      next.style.display = "none";
    }
    message.classList.add("show");
    current++;
  }, 400);
}
document.getElementById("openStory").addEventListener("click", startStory);
document.body.addEventListener("click", function(event) {
  if (!unlocked || !story.classList.contains("active")) return;
  if (event.target.closest("button,input,form")) return;
  showMessage();
});

document.querySelectorAll(".building").forEach(building => {
  for (let i = 0; i < 12; i++) {
    const windowElement = document.createElement("div");
    windowElement.className = "window";
    windowElement.style.left = (10 + Math.random() * 70) + "%";
    windowElement.style.top = (10 + Math.random() * 75) + "%";
    windowElement.style.opacity = .25 + Math.random() * .65;
    building.appendChild(windowElement);
  }
});
</script>
</body>
</html>
</body>
</html>
