<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Для тебя 🩷</title>

    <!-- Красивый шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            font-family: 'Montserrat', sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(255, 40, 150, 0.15),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(130, 30, 180, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #05020a 0%,
                    #100412 50%,
                    #030207 100%
                );
        }


        /* ==================================
           РОЗОВОЕ СВЕЧЕНИЕ
        ================================== */

        .pink-glow {
            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: #ff2b9a;

            filter: blur(120px);

            opacity: 0.18;

            left: -150px;
            top: 25%;

            pointer-events: none;
        }


        .purple-glow {
            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: #9d3cff;

            filter: blur(120px);

            opacity: 0.15;

            right: -130px;
            top: 35%;

            pointer-events: none;
        }


        /* ==================================
           ГОРОД
        ================================== */

        .city {
            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 27vh;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            gap: 4px;

            z-index: 0;

            opacity: 0.9;
        }


        .building {
            position: relative;

            width: 8vw;
            min-width: 35px;

            background:
                linear-gradient(
                    180deg,
                    #15101b,
                    #050308
                );

            border-top: 1px solid rgba(255, 75, 170, 0.08);
        }


        .building:nth-child(1) { height: 45%; }
        .building:nth-child(2) { height: 70%; }
        .building:nth-child(3) { height: 55%; }
        .building:nth-child(4) { height: 85%; }
        .building:nth-child(5) { height: 63%; }
        .building:nth-child(6) { height: 92%; }
        .building:nth-child(7) { height: 58%; }
        .building:nth-child(8) { height: 78%; }
        .building:nth-child(9) { height: 50%; }
        .building:nth-child(10) { height: 72%; }
        .building:nth-child(11) { height: 60%; }


        .window {
            position: absolute;

            width: 4px;
            height: 8px;

            background: #ff8bc9;

            box-shadow:
                0 0 8px rgba(255, 80, 180, 0.7);

            opacity: 0.5;
        }


        /* ==================================
           ПАУТИНА
        ================================== */

        .web {
            position: fixed;

            width: 310px;
            height: 310px;

            z-index: 2;

            opacity: 0.42;

            pointer-events: none;
        }


        .web-left {
            top: -55px;
            left: -55px;
        }


        .web-right {
            top: -55px;
            right: -55px;

            transform: scaleX(-1);
        }


        .web svg {
            width: 100%;
            height: 100%;
        }


        /* ==================================
           ПАУЧОК
        ================================== */

        .spiderman {
            position: fixed;

            right: 7%;
            top: -10px;

            width: 110px;
            height: 250px;

            z-index: 3;

            animation: swing 4s ease-in-out infinite;

            transform-origin: top center;
        }


        .web-line {
            position: absolute;

            top: 0;
            left: 50%;

            width: 2px;
            height: 90px;

            background:
                linear-gradient(
                    transparent,
                    rgba(255, 180, 225, 0.7)
                );
        }


        .hero {
            position: absolute;

            top: 85px;
            left: 22px;

            width: 65px;
            height: 125px;
        }


        .head {
            position: absolute;

            width: 40px;
            height: 44px;

            left: 12px;
            top: 0;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ff5eb5,
                    #b50062 70%
                );

            box-shadow:
                0 0 20px rgba(255, 30, 150, 0.45);
        }


        .eye {
            position: absolute;

            width: 11px;
            height: 18px;

            top: 12px;

            background: white;

            border: 2px solid #270018;

            transform: rotate(-18deg);
        }


        .eye.left {
            left: 6px;
        }


        .eye.right {
            right: 6px;

            transform: rotate(18deg);
        }


        .body {
            position: absolute;

            width: 47px;
            height: 62px;

            left: 9px;
            top: 39px;

            border-radius: 45% 45% 20% 20%;

            background:
                linear-gradient(
                    140deg,
                    #d71975 0%,
                    #9d145b 45%,
                    #26104c 46%,
                    #09051b 100%
                );

            box-shadow:
                0 0 15px rgba(255, 30, 150, 0.25);
        }


        .arm {
            position: absolute;

            width: 12px;
            height: 58px;

            top: 45px;

            background: #190b38;

            border-radius: 10px;
        }


        .arm.left {
            left: 2px;
            transform: rotate(25deg);
        }


        .arm.right {
            right: 2px;
            transform: rotate(-25deg);
        }


        .leg {
            position: absolute;

            width: 14px;
            height: 52px;

            top: 95px;

            background: #11072c;

            border-radius: 10px;
        }


        .leg.left {
            left: 14px;
            transform: rotate(15deg);
        }


        .leg.right {
            right: 14px;
            transform: rotate(-15deg);
        }


        @keyframes swing {

            0%, 100% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(5deg);
            }

        }


        /* ==================================
           ОСНОВНОЙ ЭКРАН
        ================================== */

        .screen {
            position: relative;

            z-index: 5;

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 25px;
        }


        .content {
            width: 100%;
            max-width: 700px;
        }


        /* ==================================
           ПЕРВЫЙ ЭКРАН
        ================================== */

        .spider-symbol {
            font-size: 45px;

            margin-bottom: 15px;

            filter:
                drop-shadow(
                    0 0 15px #ff2b9a
                );

            animation: heartbeat 2s infinite;
        }


        .intro-title {

            font-family: 'Cormorant Garamond', serif;

            font-size: clamp(
                58px,
                10vw,
                92px
            );

            font-weight: 600;

            letter-spacing: 2px;

            color: #fff;

            text-shadow:
                0 0 8px #ff4eaa,
                0 0 25px rgba(255, 30, 150, 0.7),
                0 0 55px rgba(170, 30, 255, 0.35);

            margin-bottom: 10px;
        }


        .subtitle {

            font-family: 'Cormorant Garamond', serif;

            font-size: 23px;

            color: rgba(255, 220, 240, 0.72);

            font-style: italic;

            margin-bottom: 42px;
        }


        /* ==================================
           КНОПКА
        ================================== */

        .open-btn {

            position: relative;

            border: 1px solid rgba(255, 100, 190, 0.8);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 40, 150, 0.25),
                    rgba(150, 30, 180, 0.2)
                );

            color: white;

            padding: 17px 45px;

            border-radius: 50px;

            font-family: 'Montserrat', sans-serif;

            font-size: 16px;

            letter-spacing: 1px;

            cursor: pointer;

            box-shadow:
                0 0 15px rgba(255, 30, 150, 0.45),
                inset 0 0 15px rgba(255, 80, 180, 0.1);

            transition: all 0.35s ease;
        }


        .open-btn:hover {

            transform: translateY(-3px) scale(1.06);

            border-color: #ff65ba;

            box-shadow:
                0 0 25px rgba(255, 30, 150, 0.8),
                0 0 60px rgba(180, 30, 255, 0.25);
        }


        /* ==================================
           ИСТОРИЯ
        ================================== */

        .story {
            display: none;
        }


        .story.active {
            display: block;
        }


        .message {

            min-height: 210px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-family: 'Cormorant Garamond', serif;

            font-size: clamp(
                30px,
                6vw,
                52px
            );

            line-height: 1.3;

            font-weight: 500;

            color: #fff1fa;

            text-shadow:
                0 0 10px rgba(255, 90, 180, 0.5),
                0 0 35px rgba(255, 30, 150, 0.25);

            opacity: 0;

            transform:
                translateY(25px)
                scale(0.97);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }


        .message.show {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }


        .message.final {

            font-size: clamp(
                43px,
                8vw,
                72px
            );

            font-weight: 700;

            color: #fff;

            text-shadow:
                0 0 10px #ff54ad,
                0 0 30px #ff1990,
                0 0 60px rgba(255, 0, 150, 0.65);
        }


        .next {

            margin-top: 25px;

            font-size: 12px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: rgba(255, 200, 230, 0.45);

            animation: pulse 2s infinite;
        }


        /* ==================================
           СЕРДЕЧКИ
        ================================== */

        .heart {

            position: fixed;

            bottom: -30px;

            z-index: 2;

            pointer-events: none;

            animation:
                floatUp linear forwards;
        }


        @keyframes floatUp {

            from {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            to {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }


        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }

        }


        @keyframes pulse {

            0%, 100% {
                opacity: 0.25;
            }

            50% {
                opacity: 0.7;
            }

        }


        /* ==================================
           МОБИЛЬНЫЙ
        ================================== */

        @media (max-width: 600px) {

            .spiderman {

                right: -15px;

                transform: scale(0.7);
            }


            .web {

                width: 200px;
                height: 200px;
            }


            .intro-title {

                font-size: 60px;
            }


            .subtitle {

                font-size: 19px;
            }


            .message {

                min-height: 240px;
            }

        }

    </style>

</head>


<body>


    <!-- Розовое свечение -->

    <div class="pink-glow"></div>

    <div class="purple-glow"></div>


    <!-- Паутина слева -->

    <div class="web web-left">

        <svg viewBox="0 0 310 310">

            <g
                fill="none"
                stroke="rgba(255,160,220,0.55)"
                stroke-width="1"
            >

                <path d="M0 0 Q90 35 310 0"/>
                <path d="M0 0 Q40 90 0 310"/>
                <path d="M0 0 Q130 70 310 45"/>
                <path d="M0 0 Q70 130 30 310"/>
                <path d="M0 0 Q160 110 310 100"/>
                <path d="M0 0 Q100 170 75 310"/>
                <path d="M0 0 Q210 170 170 310"/>
                <path d="M0 0 Q270 120 310 200"/>

            </g>

        </svg>

    </div>


    <!-- Паутина справа -->

    <div class="web web-right">

        <svg viewBox="0 0 310 310">

            <g
                fill="none"
                stroke="rgba(255,160,220,0.55)"
                stroke-width="1"
            >

                <path d="M0 0 Q90 35 310 0"/>
                <path d="M0 0 Q40 90 0 310"/>
                <path d="M0 0 Q130 70 310 45"/>
                <path d="M0 0 Q70 130 30 310"/>
                <path d="M0 0 Q160 110 310 100"/>
                <path d="M0 0 Q100 170 75 310"/>
                <path d="M0 0 Q210 170 170 310"/>
                <path d="M0 0 Q270 120 310 200"/>

            </g>

        </svg>

    </div>


    <!-- Паучок -->

    <div class="spiderman">

        <div class="web-line"></div>

        <div class="hero">

            <div class="head">

                <div class="eye left"></div>

                <div class="eye right"></div>

            </div>


            <div class="body"></div>

            <div class="arm left"></div>

            <div class="arm right"></div>

            <div class="leg left"></div>

            <div class="leg right"></div>

        </div>

    </div>


    <!-- Город -->

    <div class="city">

        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>

    </div>


    <!-- Основной экран -->

    <main class="screen">

        <div class="content">


            <!-- ПЕРВЫЙ ЭКРАН -->

            <div id="intro">

                <div class="spider-symbol">
                    🕷️
                </div>


                <div class="intro-title">
                    Для тебя
                </div>


                <div class="subtitle">
                    кое-что, что я хочу тебе сказать...
                </div>


                <button
                    class="open-btn"
                    onclick="startStory()"
                >
                    Открыть ❤️
                </button>

            </div>


            <!-- ИСТОРИЯ -->

            <div
                id="story"
                class="story"
            >

                <div
                    id="message"
                    class="message"
                ></div>


                <div
                    id="next"
                    class="next"
                >
                    Нажми на экран
                </div>

            </div>

        </div>

    </main>


    <script>


        /* ==================================
           ТЕКСТ
        ================================== */

        const messages = [

            "Я хочу всегда видеть твою улыбку.",

            "Даже в самые обычные дни.",

            "Потому что когда улыбаешься ты — счастливее становлюсь и я.",

            "Алия, я люблю тебя. ❤️"

        ];


        let current = 0;


        const intro =
            document.getElementById("intro");

        const story =
            document.getElementById("story");

        const message =
            document.getElementById("message");

        const next =
            document.getElementById("next");


        /* ==================================
           НАЖАТИЕ «ОТКРЫТЬ»
        ================================== */

        function startStory() {

            intro.style.display = "none";

            story.classList.add("active");


            setTimeout(() => {

                showMessage();

            }, 500);

        }


        /* ==================================
           ПОКАЗ ТЕКСТА
        ================================== */

        function showMessage() {

            if (current >= messages.length) {

                return;

            }


            message.classList.remove("show");


            setTimeout(() => {

                message.textContent =
                    messages[current];


                if (current === messages.length - 1) {

                    message.classList.add("final");

                    next.style.display = "none";

                }


                message.classList.add("show");


                current++;

            }, 400);

        }


        /* ==================================
           НАЖАТИЕ НА ЭКРАН
        ================================== */

        document.body.addEventListener(
            "click",
            function(event) {

                if (
                    event.target.classList.contains(
                        "open-btn"
                    )
                ) {

                    return;

                }


                if (
                    story.classList.contains(
                        "active"
                    )
                ) {

                    showMessage();

                }

            }
        );


        /* ==================================
           ЛЕТАЮЩИЕ СЕРДЕЧКИ
        ================================== */

        function createHeart() {

            const heart =
                document.createElement("div");


            heart.className = "heart";


            const symbols = [
                "🩷",
                "❤️",
                "💗",
                "✨",
                "🕷️"
            ];


            heart.textContent =
                symbols[
                    Math.floor(
                        Math.random() *
                        symbols.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.fontSize =
                (12 + Math.random() * 18) + "px";


            heart.style.animationDuration =
                (5 + Math.random() * 5) + "s";


            document.body.appendChild(heart);


            setTimeout(() => {

                heart.remove();

            }, 10000);

        }


        setInterval(
            createHeart,
            800
        );


        /* ==================================
           ОКНА ГОРОДА
        ================================== */

        document
            .querySelectorAll(".building")
            .forEach(building => {


                for (
                    let i = 0;
                    i < 12;
                    i++
                ) {


                    const windowElement =
                        document.createElement("div");


                    windowElement.className =
                        "window";


                    windowElement.style.left =
                        (
                            10 +
                            Math.random() * 70
                        ) + "%";


                    windowElement.style.top =
                        (
                            10 +
                            Math.random() * 75
                        ) + "%";


                    windowElement.style.opacity =
                        0.25 +
                        Math.random() * 0.65;


                    building.appendChild(
                        windowElement
                    );

                }

            });

    </script>


</body>
</html>
